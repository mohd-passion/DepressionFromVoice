<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="38" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2a33" text-anchor="start">
<tspan x="60" dy="0">Figure 1. Study design and protocol overview</tspan>
</text>
<text x="60" y="82" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#46525c" text-anchor="start">
<tspan x="60" dy="0">Shared frozen WavLM layer-9 pipeline with protocol-specific evaluation branches</tspan>
</text>
<rect x="70" y="150" width="240" height="155" rx="8" fill="#dbe8f6" stroke="#51606c" stroke-width="1.3"/>
<text x="88" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2a33" text-anchor="start">
<tspan x="88" dy="0">Input corpora</tspan>
</text>
<text x="88" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34434d" text-anchor="start">
<tspan x="88" dy="0">DAIC-WOZ interview</tspan>
<tspan x="88" dy="1.22em">speech; Android</tspan>
<tspan x="88" dy="1.22em">interview speech;</tspan>
<tspan x="88" dy="1.22em">Android reading speech</tspan>
</text>
<rect x="370" y="150" width="240" height="155" rx="8" fill="#dcefeb" stroke="#51606c" stroke-width="1.3"/>
<text x="388" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2a33" text-anchor="start">
<tspan x="388" dy="0">Audio windows</tspan>
</text>
<text x="388" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34434d" text-anchor="start">
<tspan x="388" dy="0">16 kHz audio; 10-second</tspan>
<tspan x="388" dy="1.22em">windows; 5-second hop;</tspan>
<tspan x="388" dy="1.22em">compact aggregate</tspan>
<tspan x="388" dy="1.22em">records only</tspan>
</text>
<rect x="670" y="150" width="240" height="155" rx="8" fill="#f3e6bf" stroke="#51606c" stroke-width="1.3"/>
<text x="688" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2a33" text-anchor="start">
<tspan x="688" dy="0">Representation</tspan>
</text>
<text x="688" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34434d" text-anchor="start">
<tspan x="688" dy="0">Frozen WavLM layer 9;</tspan>
<tspan x="688" dy="1.22em">temporal mean pooling;</tspan>
<tspan x="688" dy="1.22em">participant mean</tspan>
<tspan x="688" dy="1.22em">aggregation</tspan>
</text>
<rect x="970" y="150" width="240" height="155" rx="8" fill="#f1d9cf" stroke="#51606c" stroke-width="1.3"/>
<text x="988" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2a33" text-anchor="start">
<tspan x="988" dy="0">Classifier</tspan>
</text>
<text x="988" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34434d" text-anchor="start">
<tspan x="988" dy="0">Logistic regression;</tspan>
<tspan x="988" dy="1.22em">thresholds and</tspan>
<tspan x="988" dy="1.22em">calibration kept</tspan>
<tspan x="988" dy="1.22em">protocol-specific</tspan>
</text>
<rect x="1220" y="150" width="210" height="155" rx="8" fill="#edf1f3" stroke="#51606c" stroke-width="1.3"/>
<text x="1238" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2a33" text-anchor="start">
<tspan x="1238" dy="0">Scope guard</tspan>
</text>
<text x="1238" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34434d" text-anchor="start">
<tspan x="1238" dy="0">Research evaluation</tspan>
<tspan x="1238" dy="1.22em">only; no clinical</tspan>
<tspan x="1238" dy="1.22em">deployment claim</tspan>
</text>
