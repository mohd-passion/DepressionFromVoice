<text x="278" y="725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2a33" text-anchor="start">
<tspan x="278" dy="0">Interpretation discipline</tspan>
</text>
<text x="278" y="758" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34434d" text-anchor="start">
<tspan x="278" dy="0">Separate representation transfer, threshold</tspan>
<tspan x="278" dy="1.22em">shift, calibration shift, classifier-boundary</tspan>
<tspan x="278" dy="1.22em">shift and task transfer.</tspan>
</text>
<rect x="820" y="700" width="420" height="130" rx="8" fill="#dcefeb" stroke="#51606c" stroke-width="1.3"/>
<text x="838" y="725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2a33" text-anchor="start">
<tspan x="838" dy="0">Privacy discipline</tspan>
</text>
<text x="838" y="758" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#34434d" text-anchor="start">
<tspan x="838" dy="0">Figures use aggregate metrics and schematic</tspan>
<tspan x="838" dy="1.22em">placeholders only; no raw participant-level</tspan>
<tspan x="838" dy="1.22em">artifacts.</tspan>
</text>
